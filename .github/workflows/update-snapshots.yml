---
name: Update Snapshots

"on":
  push:
    branches: [fix-functions]
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Update Playwright Snapshots
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Firebase Emulators
        run: |
          npx firebase-tools emulators:start --project demo-test-project &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          echo "Waiting for Firestore emulator..."
          for i in {1..60}; do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "✓ Firestore emulator is ready"
              break
            fi
            sleep 1
          done

      - name: Update simple E2E snapshots
        run: npm run test:e2e:simple -- --update-snapshots
        env:
          CI: true
          VITE_FIREBASE_ENV: local
          VITE_FIREBASE_LOCAL_PROJECT_ID: demo-test-project
          VITE_EMULATOR_FIRESTORE_HOST: localhost
          VITE_EMULATOR_FIRESTORE_PORT: 8080
          VITE_EMULATOR_AUTH_HOST: localhost
          VITE_EMULATOR_AUTH_PORT: 9099
          VITE_GOOGLE_API_KEY: "dummy-google-api-key"
          VITE_GOOGLE_CLIENT_ID: "dummy-google-client-id"
          VITE_GOOGLE_DRIVE_CLIENT_ID: "dummy-drive-client-id"
          VITE_GOOGLE_DRIVE_FOLDER_ID: "dummy-drive-folder-id"
          VITE_GOOGLE_PHOTOS_CLIENT_ID: "dummy-photos-client-id"

      - name: Stop Simple Emulators
        if: always()
        run: |
          if [ -n "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID 2>/dev/null || true
          fi
          lsof -ti:8080 | xargs kill -9 2>/dev/null || true
          lsof -ti:9099 | xargs kill -9 2>/dev/null || true

      - name: Update Live E2E snapshots
        run: npm run test:live:e2e:screenshots
        env:
          CI: true
          E2E_GOOGLE_CLIENT_ID: ${{ secrets.E2E_GOOGLE_CLIENT_ID }}
          E2E_GOOGLE_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_CLIENT_SECRET }}
          E2E_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_DRIVE_REFRESH_TOKEN }}
          E2E_GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_PHOTOS_REFRESH_TOKEN }}
          E2E_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.E2E_GOOGLE_DRIVE_FOLDER_ID }}
          E2E_GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.E2E_GOOGLE_PHOTOS_ALBUM_ID }}

      - name: Commit and push snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/**/screenshots/*.png
          if git diff --staged --quiet; then
            echo "No changes to snapshots"
          else
            git commit -m "chore: Update Playwright snapshots [skip ci]"
            git push
          fi

      - name: Stop Emulators
        if: always()
        run: |
          if [ -n "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID 2>/dev/null || true
          fi
