---
name: Live Contracts

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  live-contracts:
    name: Vitest Live Contracts
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Run Live Contracts Tests
        run: npm run test:live:contracts
        env:
          CI: true
          E2E_GOOGLE_CLIENT_ID: ${{ secrets.E2E_GOOGLE_CLIENT_ID }}
          E2E_GOOGLE_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_CLIENT_SECRET }}
          E2E_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_DRIVE_REFRESH_TOKEN }}
          E2E_GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_PHOTOS_REFRESH_TOKEN }}
          E2E_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.E2E_GOOGLE_DRIVE_FOLDER_ID }}
          E2E_GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.E2E_GOOGLE_PHOTOS_ALBUM_ID }}
