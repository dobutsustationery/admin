---
name: E2E Tests

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
          VITE_FIREBASE_ENV: local
          VITE_FIREBASE_LOCAL_PROJECT_ID: demo-test-project
          VITE_EMULATOR_FIRESTORE_HOST: 127.0.0.1
          VITE_EMULATOR_FIRESTORE_PORT: 18080
          VITE_EMULATOR_AUTH_HOST: 127.0.0.1
          VITE_EMULATOR_AUTH_PORT: 19099
          VITE_GOOGLE_API_KEY: "dummy-google-api-key"
          VITE_GOOGLE_CLIENT_ID: "dummy-google-client-id"
          VITE_GOOGLE_DRIVE_CLIENT_ID: "dummy-drive-client-id"
          VITE_GOOGLE_DRIVE_FOLDER_ID: "dummy-drive-folder-id"
          VITE_GOOGLE_PHOTOS_CLIENT_ID: "dummy-photos-client-id"
        id: playwright_tests

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-e2e
          path: e2e/reports/html/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-e2e
          path: test-results/
          retention-days: 30
