---
name: Live E2E

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  live-e2e:
    name: Playwright Live E2E
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Live E2E tests
        run: npm run test:live:e2e
        env:
          CI: true
          E2E_GOOGLE_CLIENT_ID: ${{ secrets.E2E_GOOGLE_CLIENT_ID }}
          E2E_GOOGLE_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_CLIENT_SECRET }}
          E2E_GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_DRIVE_REFRESH_TOKEN }}
          E2E_GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_PHOTOS_REFRESH_TOKEN }}
          E2E_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.E2E_GOOGLE_DRIVE_FOLDER_ID }}
          E2E_GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.E2E_GOOGLE_PHOTOS_ALBUM_ID }}
        id: live_tests

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-live
          path: e2e/reports/html/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-live
          path: test-results/
          retention-days: 30
